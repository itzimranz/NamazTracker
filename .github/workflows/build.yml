          cat << 'EOF' > app/src/main/java/com/imran/namaztracker/NamazWidget.kt
          package com.imran.namaztracker

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews

          class NamazWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              companion object {
                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, NamazWidget::class.java))
                      for (id in ids) {
                          updateWidget(context, manager, id)
                      }
                  }

                  fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                      val prefs = context.getSharedPreferences("NamazPrefs", Context.MODE_PRIVATE)
                      val city = prefs.getString("city", "Rome") ?: "Rome"
                      val school = if (prefs.getInt("school", 0) == 1) "Hanafi" else "Standard"
                      val views = RemoteViews(context.packageName, R.layout.namaz_widget)

                      views.setTextViewText(R.id.widget_city, "🕌 Namaz ($city)")
                      views.setTextViewText(R.id.widget_school, school)
                      views.setTextViewText(R.id.w_fajr, prefs.getString("Fajr", "05:30"))
                      views.setTextViewText(R.id.w_dhuhr, prefs.getString("Dhuhr", "12:55"))
                      views.setTextViewText(R.id.w_asr, prefs.getString("Asr", "16:10"))
                      views.setTextViewText(R.id.w_maghrib, prefs.getString("Maghrib", "18:40"))
                      views.setTextViewText(R.id.w_isha, prefs.getString("Isha", "20:10"))

                      val intent = Intent(context, MainActivity::class.java)
                      val pendingIntent = PendingIntent.getActivity(
                          context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_root, pendingIntent)

                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/imran/namaztracker/MainActivity.kt
          package com.imran.namaztracker

          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.concurrent.thread
          import kotlin.math.*

          class MainActivity : AppCompatActivity(), SensorEventListener {

              private lateinit var etCity: EditText
              private lateinit var tvDate: TextView
              private lateinit var tvProgress: TextView
              private lateinit var cbFajr: CheckBox
              private lateinit var cbSunrise: CheckBox
              private lateinit var cbDhuhr: CheckBox
              private lateinit var cbAsr: CheckBox
              private lateinit var cbMaghrib: CheckBox
              private lateinit var cbIsha: CheckBox
              private lateinit var rgSchool: RadioGroup
              private lateinit var rbStandard: RadioButton
              private lateinit var rbHanafi: RadioButton
              private lateinit var tvQiblaTarget: TextView
              private lateinit var tvCompassLive: TextView
              private lateinit var tvTasbihCount: TextView
              private lateinit var tvDhikrPhrase: TextView

              private var sensorManager: SensorManager? = null
              private var accelerometer: Sensor? = null
              private var magnetometer: Sensor? = null
              private val gravity = FloatArray(3)
              private val geomagnetic = FloatArray(3)
              private var hasGravity = false
              private var hasGeomagnetic = false
              private var qiblaAngle = 123.0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  etCity = findViewById(R.id.etCity)
                  tvDate = findViewById(R.id.tvDate)
                  tvProgress = findViewById(R.id.tvProgress)
                  cbFajr = findViewById(R.id.cbFajr)
                  cbSunrise = findViewById(R.id.cbSunrise)
                  cbDhuhr = findViewById(R.id.cbDhuhr)
                  cbAsr = findViewById(R.id.cbAsr)
                  cbMaghrib = findViewById(R.id.cbMaghrib)
                  cbIsha = findViewById(R.id.cbIsha)
                  rgSchool = findViewById(R.id.rgSchool)
                  rbStandard = findViewById(R.id.rbStandard)
                  rbHanafi = findViewById(R.id.rbHanafi)
                  tvQiblaTarget = findViewById(R.id.tvQiblaTarget)
                  tvCompassLive = findViewById(R.id.tvCompassLive)
                  tvTasbihCount = findViewById(R.id.tvTasbihCount)
                  tvDhikrPhrase = findViewById(R.id.tvDhikrPhrase)

                  val prefs = getSharedPreferences("NamazPrefs", Context.MODE_PRIVATE)
                  val savedCity = prefs.getString("city", "Rome") ?: "Rome"
                  val savedSchool = prefs.getInt("school", 0)
                  qiblaAngle = prefs.getFloat("qibla", 123.0f).toDouble()

                  etCity.setText(savedCity)
                  if (savedSchool == 1) rbHanafi.isChecked = true else rbStandard.isChecked = true

                  // Setup Daily Checklist
                  val todayKey = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                  val boxes = listOf(
                      Pair("Fajr", cbFajr),
                      Pair("Dhuhr", cbDhuhr),
                      Pair("Asr", cbAsr),
                      Pair("Maghrib", cbMaghrib),
                      Pair("Isha", cbIsha)
                  )

                  for ((name, box) in boxes) {
                      box.isChecked = prefs.getBoolean("${todayKey}_$name", false)
                      box.setOnCheckedChangeListener { _, isChecked ->
                          prefs.edit().putBoolean("${todayKey}_$name", isChecked).apply()
                          updateProgress(boxes)
                      }
                  }
                  updateProgress(boxes)
                  loadSavedTimes()

                  val currentSchool = if (rbHanafi.isChecked) 1 else 0
                  fetchPrayerTimes(savedCity, currentSchool)

                  findViewById<Button>(R.id.btnFetch).setOnClickListener {
                      val city = etCity.text.toString().trim()
                      val school = if (rbHanafi.isChecked) 1 else 0
                      if (city.isNotEmpty()) {
                          fetchPrayerTimes(city, school)
                      }
                  }

                  rgSchool.setOnCheckedChangeListener { _, checkedId ->
                      val school = if (checkedId == R.id.rbHanafi) 1 else 0
                      val city = etCity.text.toString().trim().ifEmpty { "Rome" }
                      fetchPrayerTimes(city, school)
                  }

                  // Setup Digital Tasbih Counter
                  var tasbih = prefs.getInt("tasbih_count", 0)
                  updateTasbihUI(tasbih)

                  findViewById<Button>(R.id.btnTasbihTap).setOnClickListener {
                      tasbih++
                      prefs.edit().putInt("tasbih_count", tasbih).apply()
                      updateTasbihUI(tasbih)
                      vibratePhone(35)
                  }

                  findViewById<Button>(R.id.btnTasbihReset).setOnClickListener {
                      tasbih = 0
                      prefs.edit().putInt("tasbih_count", 0).apply()
                      updateTasbihUI(0)
                      vibratePhone(80)
                  }

                  // Setup Compass Sensor for Qibla
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  accelerometer = sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  magnetometer = sensorManager?.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)
              }

              private fun vibratePhone(durationMs: Long) {
                  try {
                      val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(durationMs)
                      }
                  } catch (_: Exception) {}
              }

              private fun updateTasbihUI(count: Int) {
                  tvTasbihCount.text = count.toString()
                  val cycle = count % 99
                  tvDhikrPhrase.text = when {
                      cycle < 33 -> "SubhanAllah (${(count % 33) + 1} / 33)"
                      cycle < 66 -> "Alhamdulillah (${(count % 33) + 1} / 33)"
                      else -> "Allahu Akbar (${(count % 33) + 1} / 33)"
                  }
              }

              override fun onResume() {
                  super.onResume()
                  accelerometer?.let { sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                  magnetometer?.let { sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager?.unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null) return
                  if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                      System.arraycopy(event.values, 0, gravity, 0, event.values.size)
                      hasGravity = true
                  } else if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) {
                      System.arraycopy(event.values, 0, geomagnetic, 0, event.values.size)
                      hasGeomagnetic = true
                  }
                  if (hasGravity && hasGeomagnetic) {
                      val R = FloatArray(9)
                      val I = FloatArray(9)
                      if (SensorManager.getRotationMatrix(R, I, gravity, geomagnetic)) {
                          val orientation = FloatArray(3)
                          SensorManager.getOrientation(R, orientation)
                          var azimuth = Math.toDegrees(orientation[0].toDouble())
                          azimuth = (azimuth + 360) % 360
                          val diff = abs(azimuth - qiblaAngle)
                          val aligned = diff < 8 || diff > 352
                          val status = if (aligned) "✅ FACING QIBLA!" else "Rotate phone to match ${qiblaAngle.roundToInt()}°"
                          tvCompassLive.text = "Phone Heading: ${azimuth.roundToInt()}°  •  $status"
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun calculateQibla(lat: Double, lon: Double): Double {
                  val kaabaLat = Math.toRadians(21.422487)
                  val kaabaLon = Math.toRadians(39.826206)
                  val userLat = Math.toRadians(lat)
                  val dLon = kaabaLon - Math.toRadians(lon)
                  val y = sin(dLon) * cos(kaabaLat)
                  val x = cos(userLat) * sin(kaabaLat) - sin(userLat) * cos(kaabaLat) * cos(dLon)
                  return (Math.toDegrees(atan2(y, x)) + 360) % 360
              }

              private fun updateProgress(boxes: List<Pair<String, CheckBox>>) {
                  val count = boxes.count { it.second.isChecked }
                  tvProgress.text = "Completed: $count / 5 Prayers Today"
              }

              private fun loadSavedTimes() {
                  val prefs = getSharedPreferences("NamazPrefs", Context.MODE_PRIVATE)
                  cbFajr.text = "Fajr: ${prefs.getString("Fajr", "--:--")}"
                  cbSunrise.text = "Sunrise: ${prefs.getString("Sunrise", "--:--")} (Info)"
                  cbDhuhr.text = "Dhuhr: ${prefs.getString("Dhuhr", "--:--")}"
                  cbAsr.text = "Asr: ${prefs.getString("Asr", "--:--")}"
                  cbMaghrib.text = "Maghrib: ${prefs.getString("Maghrib", "--:--")}"
                  cbIsha.text = "Isha: ${prefs.getString("Isha", "--:--")}"
                  tvQiblaTarget.text = "Qibla Bearing from ${prefs.getString("city", "Rome")}: ${qiblaAngle.roundToInt()}° from North"
              }

              private fun fetchPrayerTimes(city: String, school: Int) {
                  thread {
                      try {
                          val encodedCity = URLEncoder.encode(city, "UTF-8")
                          val url = URL("https://api.aladhan.com/v1/timingsByAddress?address=$encodedCity&method=3&school=$school")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          val response = conn.inputStream.bufferedReader().readText()
                          val json = JSONObject(response).getJSONObject("data")
                          val timings = json.getJSONObject("timings")
                          val meta = json.getJSONObject("meta")
                          val lat = meta.getDouble("latitude")
                          val lon = meta.getDouble("longitude")
                          val calculatedQibla = calculateQibla(lat, lon)

                          val dateInfo = json.getJSONObject("date")
                          val readableDate = dateInfo.getString("readable")
                          val hijri = dateInfo.getJSONObject("hijri")
                          val hijriStr = "${hijri.getString("day")} ${hijri.getJSONObject("month").getString("en")} ${hijri.getString("year")} AH"

                          val fajr = timings.getString("Fajr")
                          val sunrise = timings.getString("Sunrise")
                          val dhuhr = timings.getString("Dhuhr")
                          val asr = timings.getString("Asr")
                          val maghrib = timings.getString("Maghrib")
                          val isha = timings.getString("Isha")

                          val prefs = getSharedPreferences("NamazPrefs", Context.MODE_PRIVATE)
                          prefs.edit()
                              .putString("city", city)
                              .putInt("school", school)
                              .putFloat("qibla", calculatedQibla.toFloat())
                              .putString("Fajr", fajr)
                              .putString("Sunrise", sunrise)
                              .putString("Dhuhr", dhuhr)
                              .putString("Asr", asr)
                              .putString("Maghrib", maghrib)
                              .putString("Isha", isha)
                              .apply()

                          qiblaAngle = calculatedQibla

                          runOnUiThread {
                              tvDate.text = "$readableDate  •  $hijriStr"
                              loadSavedTimes()
                              NamazWidget.updateAllWidgets(this)
                              val schoolName = if (school == 1) "Hanafi" else "Standard"
                              Toast.makeText(this, "Updated: $city ($schoolName)", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this, "Could not fetch times. Check internet.", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NamazTrackerPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
