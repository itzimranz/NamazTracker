name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build Project
        run: |
          python3 -c "
          import os, pathlib
          def make(path, content):
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + '\n', encoding='utf-8')

          make('settings.gradle', '''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'NamazTracker'
          include(':app')
          ''')

          make('build.gradle', '''
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          ''')

          make('gradle.properties', '''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          make('app/build.gradle', '''
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.imran.namaztracker'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.imran.namaztracker'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          ''')

          make('app/src/main/AndroidManifest.xml', '''
          <?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android='http://schemas.android.com/apk/res/android'>
              <uses-permission android:name='android.permission.INTERNET' />
              <uses-permission android:name='android.permission.VIBRATE' />
              <application android:allowBackup='true' android:label='Namaz Tracker Pro' android:supportsRtl='true' android:theme='@style/Theme.MaterialComponents.DayNight.NoActionBar'>
                  <activity android:name='.MainActivity' android:exported='true' android:screenOrientation='portrait'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
                  <receiver android:name='.NamazWidget' android:exported='true'>
                      <intent-filter>
                          <action android:name='android.appwidget.action.APPWIDGET_UPDATE' />
                      </intent-filter>
                      <meta-data android:name='android.appwidget.provider' android:resource='@xml/namaz_widget_info' />
                  </receiver>
              </application>
          </manifest>
          ''')

          make('app/src/main/res/drawable/widget_bg.xml', '''
          <?xml version='1.0' encoding='utf-8'?>
          <shape xmlns:android='http://schemas.android.com/apk/res/android'>
              <solid android:color='#064E3B' />
              <corners android:radius='16dp' />
              <stroke android:width='1dp' android:color='#10B981' />
          </shape>
          ''')

          make('app/src/main/res/drawable/card_bg.xml', '''
          <?xml version='1.0' encoding='utf-8'?>
          <shape xmlns:android='http://schemas.android.com/apk/res/android'>
              <solid android:color='#064E3B' />
              <corners android:radius='14dp' />
              <stroke android:width='1dp' android:color='#047857' />
          </shape>
          ''')

          make('app/src/main/res/xml/namaz_widget_info.xml', '''
          <?xml version='1.0' encoding='utf-8'?>
          <appwidget-provider xmlns:android='http://schemas.android.com/apk/res/android'
              android:minWidth='250dp'
              android:minHeight='110dp'
              android:updatePeriodMillis='1800000'
              android:initialLayout='@layout/namaz_widget'
              android:resizeMode='horizontal|vertical'
              android:widgetCategory='home_screen' />
          ''')

          print('Base generated successfully!')
          "
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NamazTrackerPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
